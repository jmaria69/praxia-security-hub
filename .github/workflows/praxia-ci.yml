name: Praxia Security Hub CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-and-test:
    name: Security Gate, Lint & Automated Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Set up Node.js 20 (BLA Support)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio httpx presidio-analyzer presidio-anonymizer spacy pyyaml cryptography pydantic pydantic-settings
          python -m spacy download es_core_news_sm

      - name: Pre-flight Doctor Check
        run: |
          ./scripts/praxia-security doctor

      - name: Run Unit & Integration Test Suite
        run: |
          pytest tests/ -v --durations=10

      - name: Validate Project Registry & Security Policies
        run: |
          ./scripts/praxia-security projects list
          ./scripts/praxia-security reports generate -o security-report.md

      - name: Upload Security & Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: praxia-security-report
          path: security-report.md

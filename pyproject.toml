[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "praxia-security-hub"
version = "1.0.0"
description = "Praxia Labs Enterprise Security & LLM Privacy Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary / Praxia Labs"}
authors = [
    {name = "Praxia Labs Security Team", email = "security@praxialabs.com"}
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9.0",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0"
]

[project.scripts]
praxia-security = "backend.cli:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
